name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r service/requirements.txt
      - run: python -m compileall -q service/app
      - name: import smoke test
        run: |
          cd service
          python -c "from app.api import POLLERS; print(len(POLLERS), 'pollers registered')"
          python - <<'PY'
          from app.known import normalize, asset_type
          assert normalize('TSLAXUSDT') == 'TSLA'
          assert normalize('PF_TSLAXUSD', issuer_suffixes=('X',)) == 'TSLA'
          assert normalize('SKHYX', issuer_suffixes=('X','D')) == 'SKHYNIX'
          assert asset_type('SPCX') == 'pre_ipo'
          print('normalize checks OK')
          PY
